<!-- Mobile-only sticky CTA. The nav CTAs collapse behind the hamburger below
     768px, so this keeps a tappable path to signup on every scroll position. -->
<div class="sticky-cta">
  <div class="sticky-cta-inner">
    <a href="{{ site.app_url }}/signup" class="btn btn-primary" data-cta="signup" data-cta-location="sticky_mobile">Start Free Trial</a>
    <a href="{{ '/contact' | relative_url }}" class="btn btn-outline" data-cta="demo" data-cta-location="sticky_mobile">Book a Demo</a>
  </div>
  <p class="sticky-cta-note">Free for two weeks. No credit card.</p>
</div>
