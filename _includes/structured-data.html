    "{{ site.social_links.linkedin }}",
    "{{ site.social_links.twitter }}",

{% if page.url == "/" or page.url == "/index.html" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Genius Sheets",
  "operatingSystem": "Web, Windows, macOS",
  "applicationCategory": "BusinessApplication",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}",
  "offers": {
    "@type": "AggregateOffer",
    "lowPrice": "15.00",
    "priceCurrency": "USD",
    "offerCount": "3",
    "offers": [
      {
        "@type": "Offer",
        "name": "Starter",
        "price": "15.00",
        "priceCurrency": "USD",
        "description": "One user, one QuickBooks or Xero connection"
      },
      {
        "@type": "Offer",
        "name": "Business",
        "price": "75.00",
        "priceCurrency": "USD",
        "description": "One user, up to 5 QuickBooks or Xero connections"
      }
    ]
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.8",
    "ratingCount": "50"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoObject",
  "name": "Genius Sheets product demo",
  "description": "How multi-entity finance teams pull live QuickBooks Online and Xero data into Excel and Google Sheets.",
  "thumbnailUrl": "{{ site.url }}/assets/images/hero/hero-screenshot.png",
  "embedUrl": "https://player.vimeo.com/video/1041242788"
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How many entities can I connect?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "As many as you manage. Firm plans connect every QuickBooks Online and Xero file under one login, and you can mix the two freely."
      }
    },
    {
      "@type": "Question",
      "name": "Does Genius Sheets offer a free trial?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, a two-week free trial with up to 2 connections, no credit card required. Upgrade anytime from your account."
      }
    },
    {
      "@type": "Question",
      "name": "Do you support Xero?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Connect Xero organizations the same way you would a QuickBooks Online file, on every plan."
      }
    },
    {
      "@type": "Question",
      "name": "What is your cancellation policy?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cancel anytime. Manage your plan from your account, or email info@geniussheets.us."
      }
    },
    {
      "@type": "Question",
      "name": "How long does setup take?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most teams are pulling live numbers the same day. Connect QuickBooks or Xero from your dashboard, install the Excel or Google Sheets add-in, and your first formula returns real data. Firm plans include a report buildout with our team."
      }
    },
    {
      "@type": "Question",
      "name": "Do I have to rebuild my existing reports?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The formulas drop into the workbooks you already use, so your layouts, formatting, and calculations stay exactly as they are. You are replacing the exports and copy-paste, not the report."
      }
    },
    {
      "@type": "Question",
      "name": "How do I get started?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Connect QuickBooks or Xero from your dashboard, install the Excel or Google Sheets add-in, and start pulling live data."
      }
    }
  ]
}
</script>
{% endif %}
